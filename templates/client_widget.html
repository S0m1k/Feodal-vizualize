  Rstone — Клиентский визуализатор
  Вставьте этот блок в HTML-блок Tilda.
  Единственная настройка: переменная API_BASE ниже в <script>.
  ================================================================
-->

<style>
/* ============================================================
   Все классы с префиксом .rsv- — не конфликтуют со стилями Tilda
   ============================================================ */

.rsv-wrap {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 15px; color: #1e2a3b;
  max-width: 1100px; margin: 0 auto; padding: 16px;
  box-sizing: border-box;
}
.rsv-wrap *, .rsv-wrap *::before, .rsv-wrap *::after { box-sizing: border-box; }

/* ── Card ── */
.rsv-card {
  background: #fff;
  border-radius: 28px;
  box-shadow: 0 4px 32px rgba(0,0,0,.09);
  overflow: hidden;
  display: grid;
  grid-template-columns: 340px 1fr;
  min-height: 520px;
}

/* ── Left panel ── */
.rsv-left {
  padding: 28px 24px;
  border-right: 1px solid #eef2f9;
  display: flex; flex-direction: column; gap: 0;
  overflow-y: auto;
}
.rsv-section { margin-bottom: 20px; }
.rsv-section:last-child { margin-bottom: 0; }
.rsv-label {
  font-size: .72rem; font-weight: 700; color: #8899bb;
  text-transform: uppercase; letter-spacing: .07em;
  margin-bottom: 10px;
}

/* ── Upload zone ── */
.rsv-dropzone {
  border: 2px dashed #c8d4e8; border-radius: 16px;
  background: #fafcff; padding: 20px 16px;
  text-align: center; cursor: pointer; transition: all .2s;
  user-select: none;
}
.rsv-dropzone:hover, .rsv-dropzone.drag { border-color: #ff4e1f; background: #fff8f6; }
.rsv-dropzone-icon { font-size: 2rem; margin-bottom: 6px; }
.rsv-dropzone-text { font-weight: 600; color: #3d4f66; font-size: .9rem; margin-bottom: 2px; }
.rsv-dropzone-hint { font-size: .78rem; color: #9aadcc; }
.rsv-dropzone input[type=file] { display: none; }

/* ── Photo thumbnail ── */
.rsv-photo-box { display: none; position: relative; border-radius: 14px; overflow: hidden; }
.rsv-photo-box.visible { display: block; }
.rsv-photo-mini {
  width: 100%; max-height: 130px; object-fit: cover;
  border-radius: 14px; cursor: zoom-in; display: block;
}
.rsv-photo-remove {
  position: absolute; top: 7px; right: 7px;
  background: rgba(0,0,0,.6); border: none; border-radius: 20px;
  color: #fff; padding: 4px 10px; cursor: pointer; font-size: .78rem;
}

/* ── Texture ── */
.rsv-tex-empty {
  font-size: .85rem; color: #9aadcc; font-style: italic; margin-bottom: 8px;
}
.rsv-tex-selected {
  display: none; align-items: center; gap: 10px;
  padding: 10px 12px; background: #f5f7fc; border-radius: 12px;
  margin-bottom: 8px;
}
.rsv-tex-selected.visible { display: flex; }
.rsv-tex-thumb {
  width: 46px; height: 46px; border-radius: 9px;
  object-fit: cover; border: 1.5px solid #dde6f3; flex-shrink: 0;
}
.rsv-tex-info { flex: 1; min-width: 0; }
.rsv-tex-type { font-size: .7rem; color: #9aadcc; }
.rsv-tex-name { font-weight: 700; font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rsv-btn-outline {
  width: 100%; padding: 10px 16px;
  border: 2px solid #ff4e1f; background: #fff; color: #ff4e1f;
  border-radius: 40px; font-weight: 700; font-size: .88rem;
  cursor: pointer; transition: all .15s;
}
.rsv-btn-outline:hover { background: #ff4e1f; color: #fff; }

/* ── Grout ── */
.rsv-grout-section { display: none; }
.rsv-grout-section.visible { display: block; }
.rsv-grout-row { display: flex; gap: 8px; flex-wrap: wrap; }
.rsv-swatch {
  width: 38px; height: 38px; border-radius: 10px;
  cursor: pointer; border: 2.5px solid transparent;
  box-shadow: 0 1px 4px rgba(0,0,0,.13); transition: all .15s;
  flex-shrink: 0;
}
.rsv-swatch:hover { transform: scale(1.1); }
.rsv-swatch.sel { border-color: #ff4e1f; transform: scale(1.12); box-shadow: 0 0 0 3px rgba(255,78,31,.18); }

/* ── Generate button & status ── */
.rsv-gen-btn {
  width: 100%; padding: 14px;
  background: #c8d5e8; color: #fff; border: none;
  border-radius: 50px; font-weight: 700; font-size: 1rem;
  cursor: not-allowed; transition: all .2s; margin-top: auto;
}
.rsv-gen-btn.ready {
  background: linear-gradient(135deg, #ff4e1f, #ff7b1f);
  cursor: pointer; box-shadow: 0 4px 18px rgba(255,78,31,.3);
}
.rsv-gen-btn.ready:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(255,78,31,.4); }
.rsv-remaining { font-size: .75rem; color: #9aadcc; text-align: center; margin-top: 7px; }
.rsv-remaining.warn { color: #ff4e1f; font-weight: 700; }

/* ── Right panel ── */
.rsv-right {
  position: relative; background: #f4f7fc;
  display: flex; align-items: center; justify-content: center;
  min-height: 400px;
}
.rsv-preview-area {
  width: 100%; height: 100%; min-height: 400px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.rsv-empty-state { text-align: center; color: #b0bed4; user-select: none; }
.rsv-empty-icon { font-size: 3.5rem; margin-bottom: 12px; }
.rsv-empty-text { font-size: .95rem; }
.rsv-preview-img {
  max-width: 100%; max-height: 100%;
  width: 100%; height: 100%;
  object-fit: contain; cursor: zoom-in;
  display: none; border-radius: 0 28px 28px 0;
}
.rsv-preview-img.visible { display: block; }

/* Generating overlay */
.rsv-gen-overlay {
  display: none; position: absolute; inset: 0;
  background: rgba(244,247,252,.88);
  align-items: center; justify-content: center;
  flex-direction: column; gap: 14px;
  border-radius: 0 28px 28px 0;
}
.rsv-gen-overlay.visible { display: flex; }
.rsv-spinner {
  width: 44px; height: 44px;
  border: 3px solid #dde6f3;
  border-top-color: #ff4e1f;
  border-radius: 50%;
  animation: rsv-spin .8s linear infinite;
}
@keyframes rsv-spin { to { transform: rotate(360deg); } }
.rsv-gen-label { font-weight: 600; color: #3d4f66; font-size: .9rem; }

/* ── Status banner ── */
.rsv-status {
  display: none; padding: 9px 18px;
  border-radius: 40px; font-weight: 600; font-size: .87rem;
  text-align: center; margin-top: 10px;
}
.rsv-status.ok  { display: block; background: #10b981; color: #fff; }
.rsv-status.err { display: block; background: #ff4e1f; color: #fff; }

/* ── Toast ── */
.rsv-toast {
  display: none; position: fixed;
  top: 20px; right: 20px; z-index: 9999;
  background: #1e2a3b; color: #fff;
  padding: 12px 20px; border-radius: 14px;
  font-size: .88rem; font-weight: 600;
  box-shadow: 0 4px 20px rgba(0,0,0,.2);
  max-width: 320px; line-height: 1.5;
  animation: rsv-toastin .25s ease;
}
.rsv-toast.show { display: block; }
.rsv-toast.warn { background: #ff4e1f; }
@keyframes rsv-toastin { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:none; } }

/* ── Catalog Modal ── */
.rsv-modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.52); z-index: 8000;
  align-items: center; justify-content: center;
}
.rsv-modal-bg.open { display: flex; }
.rsv-modal {
  background: #fff; border-radius: 26px;
  width: 92vw; max-width: 820px; max-height: 88vh;
  display: flex; flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,.22);
  animation: rsv-modalin .2s ease;
}
@keyframes rsv-modalin { from { opacity:0; transform:scale(.95); } to { opacity:1; transform:scale(1); } }
.rsv-modal-head {
  padding: 18px 22px; border-bottom: 1px solid #eaf0f8;
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.rsv-modal-title { font-size: 1.1rem; font-weight: 700; }
.rsv-modal-close {
  background: #f4f7fc; border: none; width: 34px; height: 34px;
  border-radius: 50%; font-size: 1.1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #5b6a80; transition: all .15s;
}
.rsv-modal-close:hover { background: #ffe8e0; color: #ff4e1f; }
.rsv-modal-filters {
  padding: 16px 22px 0; display: flex; gap: 12px;
  flex-wrap: wrap; flex-shrink: 0; border-bottom: 1px solid #eaf0f8; padding-bottom: 16px;
}
.rsv-modal-body { padding: 18px 22px; overflow-y: auto; flex: 1; }
.rsv-filter-group { flex: 1; min-width: 140px; }
.rsv-filter-label {
  display: block; font-size: .72rem; font-weight: 700;
  color: #8899bb; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px;
}
.rsv-select, .rsv-input {
  width: 100%; padding: 8px 13px; border-radius: 40px;
  border: 1.5px solid #c8d4e8; background: #fff;
  font-size: .88rem; color: #1e2a3b; outline: none; transition: border .15s;
}
.rsv-select:focus, .rsv-input:focus { border-color: #ff4e1f; }

/* Texture grid */
.rsv-tex-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
}
.rsv-tex-card {
  background: #fff; border-radius: 14px;
  border: 2px solid transparent; overflow: hidden;
  cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.06);
  transition: all .18s;
}
.rsv-tex-card:hover { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(0,0,0,.1); }
.rsv-tex-card.sel { border-color: #ff4e1f; }
.rsv-tex-card-img { aspect-ratio: 1; background-size: cover; background-position: center; }
.rsv-tex-card-name {
  padding: 8px 10px; font-size: .82rem; font-weight: 600;
  border-top: 1px solid #f0f4f8; text-align: center; color: #1e2a3b;
}
.rsv-loading { padding: 32px; text-align: center; color: #9aadcc; font-size: .9rem; }

/* ── Lightbox ── */
.rsv-lightbox {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.92); z-index: 9000;
  align-items: center; justify-content: center;
}
.rsv-lightbox.open { display: flex; }
.rsv-lightbox-img { max-width: 92vw; max-height: 92vh; object-fit: contain; border-radius: 10px; }
.rsv-lightbox-close {
  position: absolute; top: 18px; right: 26px;
  color: #fff; font-size: 2.4rem; cursor: pointer;
  background: none; border: none; opacity: .8; transition: opacity .15s;
}
.rsv-lightbox-close:hover { opacity: 1; }

/* ── Responsive ── */
@media (max-width: 768px) {
  .rsv-card { grid-template-columns: 1fr; }
  .rsv-left { border-right: none; border-bottom: 1px solid #eef2f9; }
  .rsv-right { min-height: 260px; }
  .rsv-preview-img { border-radius: 0 0 28px 28px; }
  .rsv-gen-overlay { border-radius: 0 0 28px 28px; }
}
@media (max-width: 480px) {
  .rsv-wrap { padding: 10px; }
  .rsv-tex-grid { grid-template-columns: repeat(2, 1fr); }
  .rsv-modal-filters { flex-direction: column; }
}
</style>

<div class="rsv-wrap">

    <div class="rsv-left">

  <div class="rsv-modal" id="rsvCatalogModal">

<div class="rsv-toast" id="rsvToast"></div>

<script>
(function () {
  'use strict';

  // ============================================================
  //  CONFIG — измените на ваш домен
  // ============================================================
  const API_BASE = 'https://rstone.tech';

  // ============================================================
  //  STATE
  // ============================================================
  let photoFile      = null;   // File object (не сериализуется)
  let photoDataUrl   = null;   // base64 превью (sessionStorage)
  let selTexture     = null;   // { name, url, material_type, supplier }
  let selGroutName   = null;
  let remaining      = null;   // сколько генераций осталось сегодня
  let pollingTimer   = null;

  // Catalog state
  let catMat         = 'standard';
  let catSup         = null;
  let catTextures    = [];

  // Type labels
  const MAT_LABEL = { standard: 'Кирпич', rigel: 'Ригель', decorative_stone: 'Камень' };

  // ============================================================
  //  HELPERS
  // ============================================================
  const $  = id => document.getElementById(id);
  const H  = () => ({ 'ngrok-skip-browser-warning': 'true' });

  // Toast notification (вместо alert)
  let toastTimer = null;
  function toast(msg, warn = false) {
    const el = $('rsvToast');
    el.textContent = msg;
    el.className = 'rsv-toast show' + (warn ? ' warn' : '');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'rsv-toast'; }, 4000);
  }

  function setStatus(type, msg) {
    const el = $('rsvStatus');
    el.className = 'rsv-status ' + type;
    el.textContent = msg;
    if (type === 'ok') setTimeout(() => { el.className = 'rsv-status'; }, 5000);
  }

  // ============================================================
  //  PERSISTENCE (localStorage / sessionStorage)
  // ============================================================
  function saveTexture() {
    try { localStorage.setItem('rsv_tex', JSON.stringify(selTexture)); } catch {}
  }
  function loadTexture() {
    try {
      const t = localStorage.getItem('rsv_tex');
      return t ? JSON.parse(t) : null;
    } catch { return null; }
  }
  function saveGrout() {
    try { localStorage.setItem('rsv_grout', selGroutName || ''); } catch {}
  }
  function loadGrout() {
    try { return localStorage.getItem('rsv_grout') || null; } catch { return null; }
  }
  // Сохранение превью фото в sessionStorage (base64, с защитой от переполнения)
  function savePhoto(dataUrl) {
    try { sessionStorage.setItem('rsv_photo', dataUrl); } catch {} // может не влезть — ок
  }
  function loadPhoto() {
    try { return sessionStorage.getItem('rsv_photo'); } catch { return null; }
  }
  function clearPhoto() {
    try { sessionStorage.removeItem('rsv_photo'); } catch {}
  }

  // ============================================================
  //  PHOTO UPLOAD
  // ============================================================
  const dropzone = $('rsvDropzone');
  const fileInput = $('rsvFileInput');

  function applyPhotoDataUrl(dataUrl) {
    $('rsvPhotoMini').src = dataUrl;
    $('rsvPhotoBox').classList.add('visible');
    dropzone.style.display = 'none';
    // Показываем фото в правой панели, если нет результата
    if (!$('rsvPreviewImg').classList.contains('visible')) {
      showPreview(dataUrl);
    }
    refreshGenBtn();
  }

  function handleFile(file) {
    if (!file) return;
    if (!file.type.startsWith('image/'))      { toast('Неверный формат. Нужен JPG или PNG.', true); return; }
    if (file.size > 10 * 1024 * 1024)         { toast('Файл слишком большой. Максимум 10 МБ.', true); return; }
    photoFile = file;
    const reader = new FileReader();
    reader.onload = e => {
      photoDataUrl = e.target.result;
      savePhoto(photoDataUrl);
      applyPhotoDataUrl(photoDataUrl);
    };
    reader.readAsDataURL(file);
  }

  $('rsvPhotoRemove').addEventListener('click', () => {
    photoFile = null; photoDataUrl = null;
    clearPhoto();
    fileInput.value = '';
    $('rsvPhotoBox').classList.remove('visible');
    dropzone.style.display = '';
    // Убираем превью из правой панели (только если не показан результат)
    if ($('rsvPreviewImg').src === $('rsvPhotoMini').src || !$('rsvPreviewImg').dataset.isResult) {
      hidePreview();
    }
    refreshGenBtn();
  });

  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

  dropzone.addEventListener('dragover',  e => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault(); dropzone.classList.remove('drag');
    handleFile(e.dataTransfer.files[0]);
  });

  // ============================================================
  //  PREVIEW (right panel)
  // ============================================================
  function showPreview(src, isResult = false) {
    const img = $('rsvPreviewImg');
    img.src = src;
    img.classList.add('visible');
    img.dataset.isResult = isResult ? '1' : '';
    $('rsvEmptyState').style.display = 'none';
  }
  function hidePreview() {
    const img = $('rsvPreviewImg');
    img.classList.remove('visible');
    img.src = ''; img.dataset.isResult = '';
    $('rsvEmptyState').style.display = '';
  }

  // ============================================================
  //  LIGHTBOX
  // ============================================================
  window.rsvLightbox = function(src) {
    $('rsvLightboxImg').src = src;
    $('rsvLightboxEl').classList.add('open');
  };
  $('rsvLightboxClose').addEventListener('click', () => $('rsvLightboxEl').classList.remove('open'));
  $('rsvLightboxEl').addEventListener('click', e => {
    if (e.target === $('rsvLightboxEl')) $('rsvLightboxEl').classList.remove('open');
  });

  // ============================================================
  //  TEXTURE DISPLAY
  // ============================================================
  function applyTexture(tex) {
    selTexture = tex;
    saveTexture();

    $('rsvTexEmpty').style.display = 'none';
    $('rsvTexSelected').classList.add('visible');
    const url = tex.url.startsWith('http') ? tex.url : `${API_BASE}${tex.url}`;
    $('rsvTexThumb').src = url;
    $('rsvTexType').textContent = MAT_LABEL[tex.material_type] || tex.material_type;
    $('rsvTexName').textContent = tex.name;

    // Показывать затирку только если не декоративный камень
    const showGrout = tex.material_type !== 'decorative_stone';
    $('rsvGroutSection').classList.toggle('visible', showGrout);
    if (!showGrout) { selGroutName = null; saveGrout(); }

    refreshGenBtn();
  }

  // ============================================================
  //  GROUT COLORS
  // ============================================================
  async function loadGroutColors() {
    try {
      const r = await fetch(`${API_BASE}/api/client/grout-colors`, { headers: H() });
      const colors = await r.json();
      const row = $('rsvGroutRow');
      row.innerHTML = colors.map(c =>
        `<div class="rsv-swatch${selGroutName === c.name ? ' sel' : ''}"
              data-name="${c.name}" title="${c.name}"
              style="background:${c.hex_code};"></div>`
      ).join('');
      row.querySelectorAll('.rsv-swatch').forEach(el => {
        el.addEventListener('click', () => {
          selGroutName = el.dataset.name;
          saveGrout();
          row.querySelectorAll('.rsv-swatch').forEach(s => s.classList.remove('sel'));
          el.classList.add('sel');
        });
      });
    } catch(e) { console.error('grout colors:', e); }
  }

  // ============================================================
  //  CATALOG MODAL
  // ============================================================
  async function loadCatSuppliers() {
    try {
      const r = await fetch(`${API_BASE}/api/client/suppliers?material_type=${catMat}`, { credentials: 'include', headers: H() });
      const sups = await r.json();
      const sel = $('rsvCatSup');
      sel.innerHTML = sups.map(s => `<option value="${s.code}">${s.name}</option>`).join('');
      catSup = sups[0]?.code || null;
      if (catSup) loadCatTextures();
    } catch(e) { console.error('suppliers:', e); }
  }

  async function loadCatTextures() {
    if (!catSup) return;
    $('rsvCatGrid').innerHTML = '<div class="rsv-loading">Загрузка…</div>';
    try {
      const r = await fetch(`${API_BASE}/api/client/textures?material_type=${catMat}&supplier=${catSup}`, { credentials: 'include', headers: H() });
      catTextures = await r.json();
      renderCatGrid();
    } catch(e) {
      $('rsvCatGrid').innerHTML = '<div class="rsv-loading">Ошибка загрузки</div>';
    }
  }

  function renderCatGrid() {
    const q = $('rsvCatSearch').value.toLowerCase();
    const filtered = catTextures.filter(t => t.name.toLowerCase().includes(q));
    const grid = $('rsvCatGrid');
    if (!filtered.length) { grid.innerHTML = '<div class="rsv-loading">Нет текстур</div>'; return; }
    grid.innerHTML = filtered.map((tex, i) => {
      const url = tex.url.startsWith('http') ? tex.url : `${API_BASE}${tex.url}`;
      const isSel = selTexture?.name === tex.name
                 && selTexture?.material_type === catMat
                 && selTexture?.supplier === catSup;
      return `<div class="rsv-tex-card${isSel ? ' sel' : ''}" data-i="${i}">
        <div class="rsv-tex-card-img" style="background-image:url('${url}')"></div>
        <div class="rsv-tex-card-name">${tex.name}</div>
      </div>`;
    }).join('');
    grid.querySelectorAll('.rsv-tex-card').forEach(card => {
      card.addEventListener('click', () => {
        const idx = +card.dataset.i;
        applyTexture({ ...filtered[idx], material_type: catMat, supplier: catSup });
        closeCatalog();
      });
    });
  }

  function openCatalog() {
    $('rsvCatalogBg').classList.add('open');
    $('rsvCatMat').value = selTexture?.material_type || catMat;
    catMat = $('rsvCatMat').value;
    $('rsvCatSearch').value = '';
    loadCatSuppliers();
  }
  function closeCatalog() {
    $('rsvCatalogBg').classList.remove('open');
  }

  $('rsvOpenCatalog').addEventListener('click', openCatalog);
  $('rsvCatalogClose').addEventListener('click', closeCatalog);
  $('rsvCatalogBg').addEventListener('click', e => { if (e.target === $('rsvCatalogBg')) closeCatalog(); });

  $('rsvCatMat').addEventListener('change', () => { catMat = $('rsvCatMat').value; loadCatSuppliers(); });
  $('rsvCatSup').addEventListener('change', () => { catSup = $('rsvCatSup').value; loadCatTextures(); });
  $('rsvCatSearch').addEventListener('input', renderCatGrid);

  // ============================================================
  //  GENERATE BUTTON STATE
  // ============================================================
  function refreshGenBtn() {
    const ready = !!(photoFile && selTexture);
    const btn = $('rsvGenBtn');
    btn.classList.toggle('ready', ready);
    // disabled устанавливается отдельно во время генерации
  }

  function updateRemaining(n) {
    remaining = n;
    const el = $('rsvRemaining');
    if (n === null || n === undefined) { el.textContent = ''; return; }
    if (n <= 0) {
      el.textContent = '⛔ Дневной лимит исчерпан (2/2)';
      el.className = 'rsv-remaining warn';
      $('rsvGenBtn').disabled = true;
      $('rsvGenBtn').classList.remove('ready');
    } else {
      el.textContent = `Осталось генераций сегодня: ${n}`;
      el.className = 'rsv-remaining';
    }
  }

  // ============================================================
  //  GENERATION
  // ============================================================
  function setGenerating(on) {
    $('rsvGenOverlay').classList.toggle('visible', on);
    $('rsvGenBtn').disabled = on;
    $('rsvGenBtn').textContent = on ? '⏳ Генерация…' : '✨ Визуализировать';
  }

  function pollStatus(requestId) {
    let attempts = 0;
    if (pollingTimer) clearInterval(pollingTimer);
    pollingTimer = setInterval(async () => {
      attempts++;
      try {
        const r = await fetch(`${API_BASE}/status/${requestId}`, { headers: H() });
        if (!r.ok) { if (r.status === 404) return; throw new Error(`status ${r.status}`); }
        const d = await r.json();
        if (d.status === 'success') {
          clearInterval(pollingTimer);
          const url = d.result_url.startsWith('http') ? d.result_url : `${API_BASE}${d.result_url}`;
          setGenerating(false);
          showPreview(url, true);
          setStatus('ok', '✅ Готово! Нажмите на изображение для увеличения.');
          refreshGenBtn();
        } else if (d.status === 'error') {
          clearInterval(pollingTimer);
          setGenerating(false);
          setStatus('err', '❌ Ошибка генерации. Попробуйте снова.');
          refreshGenBtn();
        } else if (attempts >= 90) {
          clearInterval(pollingTimer);
          setGenerating(false);
          setStatus('err', '⏱ Превышено время ожидания. Попробуйте снова.');
          refreshGenBtn();
        }
      } catch(e) {
        console.error('poll error:', e);
      }
    }, 2000);
  }

  $('rsvGenBtn').addEventListener('click', async () => {
    if (!photoFile || !selTexture) { toast('Загрузите фото и выберите текстуру.', true); return; }
    if (remaining !== null && remaining <= 0) {
      toast('Вы исчерпали дневной лимит (2/2). Попробуйте завтра.', true); return;
    }

    setGenerating(true);
    $('rsvStatus').className = 'rsv-status';
    if (pollingTimer) clearInterval(pollingTimer);

    // Показываем фото в правой панели пока генерируем
    if (photoDataUrl) showPreview(photoDataUrl, false);

    const fd = new FormData();
    fd.append('file',          photoFile);
    fd.append('texture',       selTexture.name);
    fd.append('category',      'facade');
    fd.append('material_type', selTexture.material_type);
    fd.append('supplier',      selTexture.supplier);
    if (selGroutName) fd.append('grout_color_name', selGroutName);

    try {
      const r = await fetch(`${API_BASE}/api/client/generate`, {
        method: 'POST', credentials: 'include', headers: H(), body: fd
      });

      // 429 — лимит исчерпан
      if (r.status === 429) {
        setGenerating(false);
        updateRemaining(0);
        setStatus('err', '⛔ Вы исчерпали дневной лимит (2/2). Попробуйте завтра.');
        refreshGenBtn();
        return;
      }

      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || `Ошибка сервера ${r.status}`);

      // Обновляем счётчик оставшихся генераций
      if (d.remaining !== undefined) updateRemaining(d.remaining);

      if (d.request_id) {
        pollStatus(d.request_id);
      } else if (d.result_url) {
        // Синхронный ответ (result_url сразу)
        const url = d.result_url.startsWith('http') ? d.result_url : `${API_BASE}${d.result_url}`;
        setGenerating(false);
        showPreview(url, true);
        setStatus('ok', '✅ Готово! Нажмите на изображение для увеличения.');
        refreshGenBtn();
      } else {
        throw new Error('Неожиданный ответ сервера');
      }
    } catch(e) {
      setGenerating(false);
      setStatus('err', `❌ ${e.message}`);
      refreshGenBtn();
    }
  });

  // ============================================================
  //  INIT — восстановление состояния из хранилища
  // ============================================================
  function init() {
    // Восстановить выбранную текстуру
    const savedTex = loadTexture();
    if (savedTex) applyTexture(savedTex);

    // Восстановить цвет затирки (отмечается после загрузки цветов)
    selGroutName = loadGrout();

    // Восстановить превью фото из sessionStorage
    const savedPhoto = loadPhoto();
    if (savedPhoto) {
      photoDataUrl = savedPhoto;
      // Файл File недоступен после перезагрузки — показываем превью,
      // но генерация не будет доступна без повторной загрузки файла.
      $('rsvPhotoMini').src = savedPhoto;
      $('rsvPhotoBox').classList.add('visible');
      dropzone.style.display = 'none';
      // Фото в правой панели
      if (!selTexture) showPreview(savedPhoto, false);
      // Показываем подсказку что файл нужно загрузить снова
      $('rsvRemaining').textContent = '⚠ Файл не сохраняется при перезагрузке — загрузите фото снова.';
      $('rsvRemaining').className = 'rsv-remaining warn';
    }

    // Загрузить цвета затирки
    loadGroutColors().then(() => {
      // После загрузки подсветить сохранённый цвет
      if (selGroutName) {
        document.querySelectorAll('.rsv-swatch').forEach(s => {
          s.classList.toggle('sel', s.dataset.name === selGroutName);
        });
      }
    });

    refreshGenBtn();
  }

  init();

})();
</script>
