<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход для сотрудников</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f7fb;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { margin-bottom: 1.5rem; color: #1e293b; }
        input {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0;
            border: 1px solid #cdd9ed;
            border-radius: 60px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #ff3b3b;
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }
        button:hover { background: #e32c2c; }
        .error { color: #b91c1c; margin-top: 12px; text-align: center; }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Вход для сотрудников</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Логин" required autofocus>
        <input type="password" id="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
    </form>
    <div id="message" class="error"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            if (response.ok) {
                window.location.href = '/dashboard';
            } else {
                const data = await response.json();
                document.getElementById('message').innerText = data.detail || 'Ошибка входа';
            }
        } catch (err) {
            document.getElementById('message').innerText = 'Ошибка соединения';
        }
    });
</script>
</body>
</html>
